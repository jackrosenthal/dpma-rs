[package]
name = "res_digium_phone"
description = "Open source, drop-in replacement for the Digium Phone Module for Asterisk (DPMA)"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "res_digium_phone"
crate-type = ["cdylib", "rlib"]

[features]
# Test-only CLI commands (`dpmadev ...`) for exercising packages in the
# scratch Asterisk; never enabled in release builds.
devtest = []

[dependencies]
dpma-ast.workspace = true
dpma-proto.workspace = true
libc.workspace = true
mdns-sd = { version = "0.21.6", default-features = false }
openssl.workspace = true
serde_json.workspace = true

[build-dependencies]
dpma-build.workspace = true
