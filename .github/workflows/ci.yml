# Build, lint, and test dpma-rs against every supported Asterisk version:
# one job per major version pinned in tools/asterisk-versions.  Each
# job is a thin wrapper around `cargo xtask ci job`, which runs the same
# way locally:
#
#   cargo xtask ci setup                       # once, on Ubuntu (uses sudo)
#   DPMA_SLOT=<n> cargo xtask ci job <major>
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  versions:
    name: Pinned Asterisk versions
    runs-on: ubuntu-24.04
    outputs:
      majors: ${{ steps.pins.outputs.majors }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust 1.99
        run: |
          rustup toolchain install 1.99 --profile minimal
          rustup default 1.99

      - id: pins
        run: echo "majors=$(cargo xtask asterisk majors)" >> "$GITHUB_OUTPUT"

  test:
    name: Asterisk ${{ matrix.asterisk }}
    needs: versions
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        asterisk: ${{ fromJSON(needs.versions.outputs.majors) }}
    env:
      DPMA_SLOT: 1
      LOGDIR: ${{ github.workspace }}/test-logs
    steps:
      - uses: actions/checkout@v4

      - name: Rust 1.99
        run: |
          rustup toolchain install 1.99 --profile minimal --component clippy
          rustup default 1.99

      # Build dependencies, libclang, the suites' tools, and unprivileged
      # user namespaces (apps-discovery's network namespace).  The xtask
      # runs itself as root through sudo.
      - name: Runner setup
        run: cargo xtask ci setup

      - name: Pinned release
        id: pin
        run: cargo xtask asterisk info ${{ matrix.asterisk }} >> "$GITHUB_OUTPUT"

      # The configured, built, and installed Asterisk (source tree and
      # prefix), keyed by the release and its checksum, the runner, and the
      # build code and configuration.  It is saved right after the build,
      # so a failing test run still caches it.
      - name: Restore the Asterisk build
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: dev/asterisk-builds/${{ steps.pin.outputs.version }}
          key: asterisk-${{ steps.pin.outputs.version }}-${{ steps.pin.outputs.sha256 }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/src/**', 'tools/asterisk-conf/**') }}

      - name: Download, verify, configure, build, and install Asterisk ${{ steps.pin.outputs.version }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo xtask asterisk build --install ${{ matrix.asterisk }}

      - name: Save the Asterisk build
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dev/asterisk-builds/${{ steps.pin.outputs.version }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # cargo build, both clippy runs, cargo test, a fresh instance, and
      # every suite (cargo xtask test all, ami-expiry included).
      - name: Build, lint, and test dpma-rs
        run: cargo xtask ci job ${{ matrix.asterisk }}

      - name: Upload the test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-asterisk-${{ matrix.asterisk }}
          path: test-logs
          if-no-files-found: ignore
