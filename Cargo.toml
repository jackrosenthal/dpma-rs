[workspace]
resolver = "2"
members = [
    "crates/dpma-ast",
    "crates/dpma-bytes",
    "crates/dpma-proto",
    "crates/dpma-sys",
    "crates/res_dpma_rs",
    "tests",
    "tools",
]

[workspace.package]
version = "0.1.0"
license = "GPL-2.0-or-later"
edition = "2021"
repository = "https://github.com/jackrosenthal/dpma-rs"
rust-version = "1.99"

[workspace.dependencies]
dpma-ast = { path = "crates/dpma-ast" }
dpma-sys = { path = "crates/dpma-sys" }
dpma-bytes = { path = "crates/dpma-bytes" }
dpma-proto = { path = "crates/dpma-proto" }
bstr = { version = "1.13", default-features = false, features = ["std"] }
bindgen = "0.73"
serde_json = { version = "1.0", features = ["preserve_order"] }
libc = "0.2"
xmltree = "0.11"
serde = "1.0"
base64 = "0.22"
hex = "0.4"
# Cryptography (RustCrypto): message encryption, RSA, certificates.
aes = "0.8"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
getrandom = "0.2"
md-5 = { version = "0.10", features = ["oid"] }
rand = "0.8"
rand_chacha = "0.3"
rsa = { version = "0.9", features = ["sha1", "sha2", "pem", "hazmat"] }
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
x509-cert = { version = "0.2", default-features = false }

# RSA key generation for the test PKI (dpma-tests) is very slow unoptimized.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.dev.package.rsa]
opt-level = 3

[profile.release]
debug = 1
panic = "unwind"
