[global]
type=global
default_outbound_endpoint=dpma_endpoint

[transport-udp]
type=transport
protocol=udp
bind=127.0.0.1:15060

[dpma_endpoint]
type=endpoint
context=default
disallow=all
allow=ulaw

[1001]
type=endpoint
context=default
disallow=all
allow=ulaw
auth=1001
aors=1001
callerid="Alice Example" <1001>
mailboxes=1001@default

[1001]
type=auth
auth_type=userpass
username=1001
password=secret1001

[1001]
type=aor
max_contacts=2

[1002]
type=endpoint
context=default
disallow=all
allow=ulaw
auth=1002
aors=1002
callerid="Bob Example" <1002>

[1002]
type=auth
auth_type=userpass
username=1002
password=secret1002

[1002]
type=aor
max_contacts=2
