; Test phones for package P12 (request handlers).  Installed by
; dev/tests/request-handlers/setup.sh and included from
; res_digium_phone.conf, next to the simulator's standard phones
; (dev/sim/conf/res_digium_phone_sim.conf).

; A pin, a group pin, and a line with a secret and an extension.
[p12a]
type=phone
mac=000fd3001201
pin=4321
group_pin=7777
line=p12a-line
full_name=P12 Phone A

; No pin, the same group pin, a line without a secret.
[p12b]
type=phone
mac=000fd3001202
group_pin=7777
line=p12b-line

; Its own group pin, and a configuration file served instead of a built
; document (read from file_directory).
[p12c]
type=phone
mac=000fd3001203
pin=9999
group_pin=8888
line=p12c-line
config_file=p12c-config.xml

[p12a-line]
type=line
secret=lsecret
exten=5201

[p12b-line]
type=line
exten=5202

[p12c-line]
type=line
exten=5203
