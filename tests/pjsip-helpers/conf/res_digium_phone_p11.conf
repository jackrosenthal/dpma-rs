; Phones and lines for the PJSIP helper tests (tests/pjsip-helpers).
; Installed into an instance by ../setup.sh.  Phone 2001 is named after
; the AOR 2001: the helper records REGISTERs from Digium phones as the last
; URI of the phone named after the contact's AOR.

[2001]
type=phone
mac=000fd3001001
pin=1234
line=2001
line=2002
full_name=P11 Phone One

[2003]
type=phone
mac=000fd3001003
pin=1234
network=p11-net
line=2003
line=2004
line=2005

; A network, so the phone's configuration document has line accounts
; (stress.py reads line 2005's account from it).
[p11-net]
type=network
cidr=0.0.0.0/0
registration_address=127.0.0.1

[2002]
type=line
line_label=Two
context=from-line-section
mailbox=from-line-section@default

[2004]
type=line
line_label=No endpoint

[2005]
type=line
line_label=ARI
