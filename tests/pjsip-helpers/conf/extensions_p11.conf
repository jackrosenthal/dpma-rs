; Dialplan for the PJSIP helper tests (dev/tests/pjsip-helpers).
; Installed into an instance by ../setup.sh.

[p11-phones]
exten => 2002,hint,PJSIP/2002
exten => 2002,1,Dial(PJSIP/2002,30)
; A call to 2002 from "Carol Caller" <3003>.
exten => 3002,1,Set(CALLERID(all)="Carol Caller" <3003>)
 same => n,Dial(PJSIP/2002,30)
; The same with name and number restricted.
exten => 3012,1,Set(CALLERID(all)="Rita Restricted" <3013>)
 same => n,Set(CALLERID(num-pres)=prohib)
 same => n,Set(CALLERID(name-pres)=prohib)
 same => n,Dial(PJSIP/2002,30)

; MESSAGEs reach this context when pjsip_message_context=dpma-p11-test.
[dpma-p11-test]
exten => probe,1,Verbose(0,P11 probe: ${MESSAGE(body)})
 same => n,Hangup()
