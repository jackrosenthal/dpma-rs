; P14 test dialplan (dev/tests/apps-discovery).  run.py originates
; Local/<app>@dpma-apps with the variables P14ID (the test's AstDB key),
; P14ARGS (the application's arguments), and P14KEYS (DTMF to send).
; The ;2 half runs the application; the ;1 half runs keys@dpma-apps-keys,
; which sends P14KEYS (one key per P14GAP seconds) into the playback.  On
; hangup the h extension stores the result variables in AstDB family
; dpma-apps, key P14ID:
;   <CPLAYBACKSTATUS>|<CPLAYBACKSTOPKEY>|<CPLAYBACKOFFSET>|<VOICEMAIL_PLAYBACKSTATUS>
[dpma-apps]
; DigiumControlPlayback
exten => dcp,1,Answer()
 same => n,DigiumControlPlayback(${P14ARGS})
 same => n,Hangup()
; Asterisk's ControlPlayback, for comparison
exten => acp,1,Answer()
 same => n,ControlPlayback(${P14ARGS})
 same => n,Hangup()
; DigiumVoicemailPlayback (answers by itself)
exten => vmp,1,DigiumVoicemailPlayback(${P14ARGS})
 same => n,Hangup()
exten => h,1,Set(DB(dpma-apps/${P14ID})=${CPLAYBACKSTATUS}|${CPLAYBACKSTOPKEY}|${CPLAYBACKOFFSET}|${VOICEMAIL_PLAYBACKSTATUS})

[dpma-apps-keys]
exten => keys,1,Wait(${IF($["${P14GAP}" = ""]?1:${P14GAP})})
 same => n,GotoIf($["${P14KEYS}" = ""]?wait)
 same => n,Set(K=${P14KEYS:0:1})
 same => n,Set(P14KEYS=${P14KEYS:1})
 same => n,SendDTMF(${K})
 same => n,Goto(1)
 same => n(wait),Wait(30)
