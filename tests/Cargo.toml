[package]
name = "dpma-tests"
description = "Test support for dpma-rs: the phone simulator, test PKI, AMI and SIP clients, mDNS browser, harness, and the test suites"
version.workspace = true
license.workspace = true
edition.workspace = true
publish = false

[dependencies]
anyhow = "1"
base64.workspace = true
bstr.workspace = true
clap = { version = "4", features = ["derive"] }
dpma-proto.workspace = true
hex.workspace = true
libc.workspace = true
rand.workspace = true
regex = "1"
rsipstack = "0.8.4"
rsa.workspace = true
roxmltree = "0.21"
serde_json.workspace = true
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "net"] }
tokio-util = "0.7"
ureq = { version = "3", default-features = false }

[lib]
path = "src/lib.rs"

# The test suites run against a private Asterisk instance; they are
# skipped unless run with `-- --ignored` (see the dpma_tests::harness
# documentation).
[[test]]
name = "session"
path = "suites/session/main.rs"
harness = false

[[test]]
name = "config-xml"
path = "suites/config-xml/main.rs"
harness = false

[[test]]
name = "users-runtime"
path = "suites/users-runtime/main.rs"
harness = false

[[test]]
name = "request-handlers"
path = "suites/request-handlers/main.rs"
harness = false

[[test]]
name = "methods-vm"
path = "suites/methods-vm/main.rs"
harness = false

[[test]]
name = "methods-calls"
path = "suites/methods-calls/main.rs"
harness = false

[[test]]
name = "pjsip-helpers"
path = "suites/pjsip-helpers/main.rs"
harness = false

[[test]]
name = "ami"
path = "suites/ami/main.rs"
harness = false

[[test]]
name = "apps-discovery"
path = "suites/apps-discovery/main.rs"
harness = false
