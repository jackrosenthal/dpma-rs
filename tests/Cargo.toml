[package]
name = "dpma-tests"
description = "Test support for dpma-rs: the phone simulator, test PKI, AMI and SIP clients, mDNS browser, harness, and the test suites"
version.workspace = true
license.workspace = true
edition.workspace = true
publish = false

[dependencies]
aes.workspace = true
anyhow = "1"
base64.workspace = true
bstr.workspace = true
cbc.workspace = true
clap = { version = "4", features = ["derive"] }
hex.workspace = true
libc.workspace = true
md-5.workspace = true
rand.workspace = true
regex = "1"
rsa.workspace = true
roxmltree = "0.21"
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
socket2 = { version = "0.5", features = ["all"] }
ureq = { version = "3", default-features = false }
x509-cert = { workspace = true, features = ["builder", "hazmat", "pem"] }

[lib]
path = "src/lib.rs"

# The test suites run against a private Asterisk instance; they are
# skipped unless run with `-- --ignored` (see the dpma_tests::harness
# documentation).
[[test]]
name = "session"
path = "suites/session/main.rs"
harness = false

[[test]]
name = "config-xml"
path = "suites/config-xml/main.rs"
harness = false

[[test]]
name = "users-runtime"
path = "suites/users-runtime/main.rs"
harness = false

[[test]]
name = "request-handlers"
path = "suites/request-handlers/main.rs"
harness = false

[[test]]
name = "methods-vm"
path = "suites/methods-vm/main.rs"
harness = false

[[test]]
name = "methods-calls"
path = "suites/methods-calls/main.rs"
harness = false

[[test]]
name = "pjsip-helpers"
path = "suites/pjsip-helpers/main.rs"
harness = false

[[test]]
name = "parity"
path = "suites/parity/main.rs"
harness = false

[[test]]
name = "ami"
path = "suites/ami/main.rs"
harness = false

[[test]]
name = "apps-discovery"
path = "suites/apps-discovery/main.rs"
harness = false

[[test]]
name = "raw-bytes"
path = "suites/raw-bytes/main.rs"
harness = false
