; P10 method tests (dev/tests/methods-calls): phones with queue and parking
; applications and a contacts file.  Line 1001 is PJSIP endpoint 1001.

[p10phone]
type=phone
mac=000fd3000010
line=1001
application=p10-sales
application=p10-support
application=p10-mgr
application=p10-nosuchapp
application=p10-parking
