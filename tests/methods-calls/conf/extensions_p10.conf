; P10 method tests (tests/methods-calls).
[p10test]
; A queue member that answers.
exten => agent,1,Answer()
 same => n,Wait(120)
 same => n,Hangup()
exten => bob,1,Answer()
 same => n,Wait(120)
 same => n,Hangup()
exten => 1001,1,Answer()
 same => n,Wait(120)
 same => n,Hangup()
; Queue callers.
exten => caller,1,Set(CALLERID(all)="Queue Caller" <5551000>)
 same => n,Queue(p10sales)
 same => n,Hangup()
exten => caller2,1,Set(CALLERID(all)="Second Caller" <5552000>)
 same => n,Queue(p10sales)
 same => n,Hangup()
; The login and logout extensions of the p10-support application.
exten => login,1,Verbose(1,P10 login exten called by ${CALLERID(num)})
 same => n,AddQueueMember(p10support,Local/1001@p10test)
 same => n,Hangup()
exten => logout,1,Verbose(1,P10 logout exten called by ${CALLERID(num)})
 same => n,RemoveQueueMember(p10support,Local/1001@p10test)
 same => n,Hangup()
; Parked calls: parked "by" PJSIP/1001 (a blind transfer), by a chan_sip
; dial string, and by nobody in particular.
exten => park,1,Set(CALLERID(all)="Parked Caller" <5553000>)
 same => n,Set(BLINDTRANSFER=PJSIP/1001-00000099)
 same => n,Park(default)
exten => parksip,1,Set(BLINDTRANSFER=SIP/1001-00000001)
 same => n,Park(default)
exten => parklot,1,Set(CALLERID(all)="Lot Caller" <5554000>)
 same => n,Park(p10lot)
exten => park1002,1,Set(BLINDTRANSFER=PJSIP/1002-00000098)
 same => n,Park(default)
