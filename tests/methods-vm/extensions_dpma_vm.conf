; P9 test dialplan (dev/tests/methods-vm).  run.py originates
; Local/<box>@dpma-vm-leave (or dpma-vm-urgent) with a caller id and
; connects the other half to tone@dpma-vm-source, so VoiceMail() records
; a Milliwatt tone until maxsecs.
[dpma-vm-leave]
exten => _X.,1,VoiceMail(${EXTEN}@default,s)
 same => n,Hangup()
exten => _oX.,1,VoiceMail(${EXTEN:1}@other,s)
 same => n,Hangup()

[dpma-vm-urgent]
exten => _X.,1,VoiceMail(${EXTEN}@default,sU)
 same => n,Hangup()

[dpma-vm-source]
exten => tone,1,Answer()
 same => n,Milliwatt()
