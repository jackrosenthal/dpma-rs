; Test dialplan of the apps-discovery suite.  The suite originates
; Local/<app>@dpma-apps with the variables TEST_ID (the test's AstDB key),
; TEST_ARGS (the application's arguments), and TEST_KEYS (DTMF to send).
; The ;2 half runs the application; the ;1 half runs keys@dpma-apps-keys,
; which sends TEST_KEYS (one key per TEST_GAP seconds) into the playback.  On
; hangup the h extension stores the result variables in AstDB family
; dpma-apps, key TEST_ID:
;   <CPLAYBACKSTATUS>|<CPLAYBACKSTOPKEY>|<CPLAYBACKOFFSET>|<VOICEMAIL_PLAYBACKSTATUS>
[dpma-apps]
; DigiumControlPlayback
exten => dcp,1,Answer()
 same => n,DigiumControlPlayback(${TEST_ARGS})
 same => n,Hangup()
; Asterisk's ControlPlayback, for comparison
exten => acp,1,Answer()
 same => n,ControlPlayback(${TEST_ARGS})
 same => n,Hangup()
; DigiumVoicemailPlayback (answers by itself)
exten => vmp,1,DigiumVoicemailPlayback(${TEST_ARGS})
 same => n,Hangup()
exten => h,1,Set(DB(dpma-apps/${TEST_ID})=${CPLAYBACKSTATUS}|${CPLAYBACKSTOPKEY}|${CPLAYBACKOFFSET}|${VOICEMAIL_PLAYBACKSTATUS})

[dpma-apps-keys]
exten => keys,1,Wait(${IF($["${TEST_GAP}" = ""]?1:${TEST_GAP})})
 same => n,GotoIf($["${TEST_KEYS}" = ""]?wait)
 same => n,Set(K=${TEST_KEYS:0:1})
 same => n,Set(TEST_KEYS=${TEST_KEYS:1})
 same => n,SendDTMF(${K})
 same => n,Goto(1)
 same => n(wait),Wait(30)
