; Test phones for package P13 (AMI messages) and the end-to-end checks of
; the phone users runtime (reconfigure, events).  Installed by the ami
; suite (tests/suites/ami) and included from res_digium_phone.conf; its
; reload part rewrites the lines of p13phone and removes p13phone2.

[p13phone]
type=phone
mac=000fd3001301
pin=1313
full_name=P13 Phone
line=p13line

[p13phone2]
type=phone
mac=000fd3001302
pin=2323
line=p13line2

; Never contacts the server.
[p13phone3]
type=phone
mac=000fd3001303
pin=3333
line=p13line3

[p13line]
type=line

[p13line2]
type=line

[p13line3]
type=line

[p13line4]
type=line
