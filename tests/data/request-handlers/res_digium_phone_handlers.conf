; Test phones for the request-handlers suite, included from
; res_digium_phone.conf next to the simulator's standard phones.

; A line with a secret and an extension.
[phonea]
type=phone
mac=000fd3001201
pin=4321
group_pin=7777
line=phonea-line
full_name=Test Phone A

; No pin, and a line without a secret.
[phoneb]
type=phone
mac=000fd3001202
group_pin=7777
line=phoneb-line

; A configuration file served instead of a built document (read from
; file_directory).
[phonec]
type=phone
mac=000fd3001203
pin=9999
group_pin=8888
line=phonec-line
config_file=phonec-config.xml

[phonea-line]
type=line
secret=lsecret
exten=5201

[phoneb-line]
type=line
exten=5202

[phonec-line]
type=line
exten=5203
