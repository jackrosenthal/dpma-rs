; The methods-vm suite's voicemail.conf, which replaces the instance's.
; Each message the suite leaves is a 2 second Milliwatt tone (maxsecs).
[general]
format=wav
attach=no
maxsecs=2
minsecs=0
maxsilence=0
skipms=3000
maxlogins=3

[zonemessages]
eastern=America/New_York|'vm-received' Q 'digits/at' IMp

[default]
1001 => 1111,Alice Example
1002 => 2222,Bob Example
1003 => 3333,Unused Mailbox
bob101 => -9876,Bob Example

[other]
2001 => 4444,Carol Other
