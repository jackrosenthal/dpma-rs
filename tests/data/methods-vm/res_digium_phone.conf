; P9 test configuration: phones whose lines have voicemail mailboxes, for
; the switchvox.users.voicemail.* methods (the methods-vm suite,
; tests/suites/methods-vm).
[general]
globalpin=344486
userlist_auth=disabled
config_auth=mac_globalpin
service_discovery_enabled=no

; Folder names as the phone shows them (getFolderList, getList) and as
; the phone may send them back (getList, move, remove, markRead).
[de_DE]
type=translation
INBOX=Posteingang
Work=Arbeit
Family=Familie
Recordings=Aufnahmen

[vm-de]
type=application
application=voicemail
translation=de_DE
require_password=true

[vm-plain]
type=application
application=voicemail

; Translated folders; 1001 has a mailbox, 1003 has none, ext1 is an
; external line.  The primary line 1001 is the PJSIP endpoint that play
; dials (pjsip.conf of the instance).
[vmphone]
type=phone
mac=000fd3vm0001
pin=1234
line=1001
line=1003
external_line=ext1
application=missing-app
application=vm-de
full_name=VM Phone

; No translation.
[vmphone2]
type=phone
mac=000fd3vm0002
pin=2222
line=1002
application=vm-plain

; A mailbox in another voicemail context.
[vmphone3]
type=phone
mac=000fd3vm0003
pin=3333
line=2001

; A phone whose only line has no mailbox.
[nomboxphone]
type=phone
mac=000fd3vm0004
pin=4444
line=1004

; A phone whose mailbox does not exist in voicemail.conf.
[ghostphone]
type=phone
mac=000fd3vm0005
pin=5555
line=1005

[1001]
type=line
mailbox=1001@default
tech=PJSIP

[1002]
type=line
mailbox=1002
tech=PJSIP

[1003]
type=line

[1004]
type=line

[1005]
type=line
mailbox=1005@default

[2001]
type=line
mailbox=2001@other
tech=PJSIP

[ext1]
type=external_line
server_address=pbx.example.com
userid=ext1
