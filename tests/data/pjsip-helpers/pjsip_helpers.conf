; PJSIP configuration for the PJSIP helper tests (tests/suites/pjsip-helpers).
; Installed into an instance by the suite.  The instance's pjsip.conf
; must set default_outbound_endpoint (the scratch install's does).
;
; 2001: a phone line with a mailbox on the endpoint (two of them: the
;       line gets the first).
; 2002: two auths (the line gets the first), two AORs (the first has no
;       mailboxes, so the line gets the first mailbox of the second);
;       res_digium_phone_helpers.conf also has a [2002] line section.
; 2003: an auth whose username differs from the endpoint name.
; 2004: no endpoint (a line section only).
; 2005: created, changed, and deleted through ARI (push configuration;
;       sorcery_helpers.conf adds memory wizards).

[2001]
type=endpoint
context=test-phones
disallow=all
allow=ulaw
auth=2001-auth
aors=2001
callerid="Phone One" <2001>
mailboxes=2001@default,2091@default

[2001-auth]
type=auth
auth_type=userpass
username=2001
password=pw2001

[2001]
type=aor
max_contacts=1
remove_existing=yes

[2002]
type=endpoint
context=test-phones
disallow=all
allow=ulaw
auth=2002-auth,2002-other
aors=2002x,2002
callerid="Phone Two" <2002>

[2002-auth]
type=auth
auth_type=userpass
username=2002
password=pw2002

[2002-other]
type=auth
auth_type=userpass
username=other
password=other

[2002x]
type=aor
max_contacts=1

[2002]
type=aor
mailboxes=2002@vmctx,2092@vmctx
max_contacts=2
remove_existing=yes

[2003]
type=endpoint
context=test-phones
disallow=all
allow=ulaw
auth=2003-auth
aors=2003

[2003-auth]
type=auth
auth_type=userpass
username=user2003
password=pw2003

[2003]
type=aor
max_contacts=1
remove_existing=yes
