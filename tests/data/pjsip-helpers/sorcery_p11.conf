; Memory wizards, so that ARI push configuration creates, updates, and
; deletes PJSIP objects and the helper's sorcery observers run.
; Installed into an instance by tests/suites/pjsip-helpers.

[res_pjsip]
endpoint=config,pjsip.conf,criteria=type=endpoint
endpoint=memory
aor=config,pjsip.conf,criteria=type=aor
aor=memory
auth=config,pjsip.conf,criteria=type=auth
auth=memory
