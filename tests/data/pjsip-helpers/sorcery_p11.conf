; Memory wizards for PJSIP endpoints, AORs, and auths, so ARI push
; configuration (PUT/DELETE /ari/asterisk/config/dynamic/res_pjsip/...)
; creates, updates, and deletes them and the helper's sorcery observers
; run.  Installed into an instance by tests/suites/pjsip-helpers.

[res_pjsip]
endpoint=config,pjsip.conf,criteria=type=endpoint
endpoint=memory
aor=config,pjsip.conf,criteria=type=aor
aor=memory
auth=config,pjsip.conf,criteria=type=auth
auth=memory
