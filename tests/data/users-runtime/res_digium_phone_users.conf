; Test phones for the users-runtime suite, included from
; res_digium_phone.conf.

; Two status applications (one with an empty sub-state) and a missing
; application.
[testphone]
type=phone
mac=000fd3000801
pin=1111
group_pin=GP8
line=testline
line=testline2
application=test-dnd
application=test-avail
application=test-missing
full_name=Test Phone
network=network1

; No status application: the default presence options.
[testphone2]
type=phone
mac=000fd3000802
pin=2222
line=testline3
network=network1

; No lines at all.
[testnolines]
type=phone
mac=000fd3000803

[testline]
type=line
secret=s3cret
mailbox=8001@default
exten=8101

[testline2]
type=line

[testline3]
type=line

[test-dnd]
type=application
application=status
status=dnd
substatus=In a meeting
substatus=
send486=no

[test-avail]
type=application
application=status
status=available
send486=yes

; Named after the PJSIP AOR 1001 of the scratch pjsip.conf: on a REGISTER
; the module's endpoint identifier (the official DPMA's helper) looks up a phone
; with the AOR's name and records its last URI.
[1001]
type=phone
mac=000fd3000810
line=1001
