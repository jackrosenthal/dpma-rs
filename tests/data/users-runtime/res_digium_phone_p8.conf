; Test phones for package P8 (users runtime): presence options from status
; applications, tokens, lookups, and last-seen information.  Installed by
; the users-runtime suite and included from res_digium_phone.conf.

; Two status applications (one with an empty sub-state), a missing
; application, a group pin, and two lines.
[p8phone]
type=phone
mac=000fd3000801
pin=1111
group_pin=GP8
line=p8line
line=p8line2
application=p8-dnd
application=p8-avail
application=p8-missing
full_name=P8 Phone
network=network1

; No status application: the six default presence options.
[p8phone2]
type=phone
mac=000fd3000802
pin=2222
line=p8line3
network=network1

; No lines at all.
[p8nolines]
type=phone
mac=000fd3000803

[p8line]
type=line
secret=s3cret
mailbox=8001@default
exten=8101

[p8line2]
type=line

[p8line3]
type=line

[p8-dnd]
type=application
application=status
status=dnd
substatus=In a meeting
substatus=
send486=no

[p8-avail]
type=application
application=status
status=available
send486=yes

; Named after the PJSIP AOR 1001 of the scratch pjsip.conf: on a REGISTER
; the module's endpoint identifier (the official DPMA's helper) looks up a phone
; with the AOR's name and records its last URI.
[1001]
type=phone
mac=000fd3000810
line=1001
