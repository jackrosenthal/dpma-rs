; Test-only dialplan for the DPMA phone simulator.  Installed into an
; instance by dpma_tests::harness::fixtures::install_sim_conf.

; MESSAGEs from 127.0.0.2 (see pjsip_dpma_sim.conf).  Every chunk is logged
; with its AppServer headers; an Echo is answered like the module's
; handle_request_echo, without encryption or chunking.
[dpma-sim-loopback]
exten => proxy,1,Verbose(0,DPMA-SIM loopback: type=${MESSAGE_DATA(X-Digium-AppServer-RequestType)} id=${MESSAGE_DATA(X-Digium-AppServer-ID)} mac=${MESSAGE_DATA(X-Digium-AppServer-MACAddress)} session=${MESSAGE_DATA(X-Digium-AppServer-Session)} seq=${MESSAGE_DATA(X-Digium-AppServer-Message-Sequence)} finished=${MESSAGE_DATA(X-Digium-AppServer-Message-Finished)} salt=${MESSAGE_DATA(X-Digium-AppServer-Message-Salt)} ua=${MESSAGE_DATA(User-Agent)} contact=${MESSAGE_DATA(Contact)} recvaddr=${MESSAGE_DATA(PJSIP_RECVADDR)} transport=${MESSAGE_DATA(PJSIP_TRANSPORT)} endpoint=${MESSAGE_DATA(PJSIP_ENDPOINT)} body=${MESSAGE(body)})
 same => n,GotoIf($["${MESSAGE_DATA(X-Digium-AppServer-RequestType)}" != "Echo"]?done)
 same => n,Set(MESSAGE_DATA(X-Digium-AppServer-ResponseType)=EchoResponse)
 same => n,Set(MESSAGE_DATA(X-Digium-AppServer-Error-ID)=0)
 same => n,Set(MESSAGE_DATA(X-Digium-AppServer-ID)=${MESSAGE_DATA(X-Digium-AppServer-ID)})
 same => n,MessageSend(pjsip:${MESSAGE_DATA(PJSIP_RECVADDR)}\;transport=${MESSAGE_DATA(PJSIP_TRANSPORT)},sip:proxy@127.0.0.1)
 same => n,Verbose(0,DPMA-SIM loopback: MessageSend status ${MESSAGE_SEND_STATUS})
 same => n(done),Hangup()

; Server-originated MESSAGE to a listening simulator on 127.0.0.1:<port>:
;   channel originate Local/<port>@dpma-sim-send application Wait 1
; sends an unencrypted digium.config.update event (body
; "Command: <config></config>"), like phone_msg_send_event without a
; session.
[dpma-sim-send]
exten => _X.,1,Set(MESSAGE(body)=Command: <config></config>)
 same => n,Set(MESSAGE_DATA(X-Event-Name)=digium.config.update)
 same => n,MessageSend(pjsip:127.0.0.1:${EXTEN},sip:proxy@127.0.0.1)
 same => n,Verbose(0,DPMA-SIM send to 127.0.0.1:${EXTEN}: ${MESSAGE_SEND_STATUS})
 same => n,Hangup()
