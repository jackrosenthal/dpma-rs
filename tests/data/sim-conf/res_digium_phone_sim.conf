; Standard test phones for the DPMA phone simulator (the dpma-tests crate).
; Installed into an instance by dpma_tests::harness::fixtures::install_sim_conf
; and included from res_digium_phone.conf.  The lines are the PJSIP endpoints 1001 and 1002
; of the scratch pjsip.conf.

; The simulator's default phone: dpma-sim --mac 000fd3000001 (default).
[simphone]
type=phone
mac=000fd3000001
pin=1234
line=1001
full_name=Sim Phone

; A second phone: dpma-sim --mac 000fd3000002.
[simphone2]
type=phone
mac=000fd3000002
pin=5678
line=1002
full_name=Sim Phone Two

[1001]
type=line

[1002]
type=line
