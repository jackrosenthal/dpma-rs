; Test-only PJSIP configuration for the DPMA phone simulator
; (dev/sim/README.md; dev/notes/port-plan.md, section 6.3).  Installed into
; an instance by dev/sim/install-conf.sh, which replaces @SIP_PORT@.
;
; MESSAGEs from the simulator are matched to an endpoint by source address
; here, a test-only stand-in for the module's endpoint identifier (which
; identifies them by their X-Digium-User-Agent header).  Remove the
; [dpma-sim] identify (or the #include) when testing the endpoint
; identifier or other PJSIP clients: it identifies every request from
; 127.0.0.1, REGISTERs included.

; TCP on the same port as UDP (dpma_sim.py --transport tcp).
[transport-tcp]
type=transport
protocol=tcp
bind=127.0.0.1:@SIP_PORT@

; The phone path: MESSAGEs from 127.0.0.1 go to the module's routing context.
[dpma-sim]
type=endpoint
context=dpma_pjsip_message_context
message_context=dpma_pjsip_message_context
disallow=all
allow=ulaw

[dpma-sim]
type=identify
endpoint=dpma-sim
match=127.0.0.1

; The loopback path: MESSAGEs from 127.0.0.2 (dpma_sim.py --local-host
; 127.0.0.2) go to the static [dpma-sim-loopback] context in
; extensions_dpma_sim.conf, which logs them and answers Echo requests the
; way the module does.  Tests the simulator's SIP layer without the module.
[dpma-sim-loopback]
type=endpoint
context=dpma-sim-loopback
message_context=dpma-sim-loopback
disallow=all
allow=ulaw

[dpma-sim-loopback]
type=identify
endpoint=dpma-sim-loopback
match=127.0.0.2
