; Standard test phones for the DPMA phone simulator (tests/sim/README.md).
; Installed into an instance by tests/sim/install-conf.sh and included from
; res_digium_phone.conf.  The lines are the PJSIP endpoints 1001 and 1002
; of the scratch pjsip.conf.

; The simulator's default phone: dpma_sim.py --mac 000fd3000001 (default).
[simphone]
type=phone
mac=000fd3000001
pin=1234
line=1001
full_name=Sim Phone

; A second phone: dpma_sim.py --mac 000fd3000002.
[simphone2]
type=phone
mac=000fd3000002
pin=5678
line=1002
full_name=Sim Phone Two

[1001]
type=line

[1002]
type=line
